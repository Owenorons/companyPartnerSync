<template>
  <div class="ps-page">
    <template if:true={loading}>
      <div class="page-shell">
        <c-ps-loading-state
          message="Loading your partner workspace..."
        ></c-ps-loading-state>
      </div>
    </template>

    <template if:true={error}>
      <div class="page-shell">
        <c-ps-error-panel message={error}></c-ps-error-panel>
      </div>
    </template>

    <template if:true={dashboard}>
      <section class="hero">
        <div class="page-shell">
          <p class="eyebrow">PartnerSync Accelerator</p>
          <h1>Welcome back, {dashboard.partnerName}</h1>
          <p class="subtitle">
            Track leads, deals, MDF, content, and performance from one partner
            workspace.
          </p>
          <div class="hero-meta">
            <c-ps-status-badge
              label={dashboard.partnerStatus}
              variant={statusVariant}
            ></c-ps-status-badge>
            <span class={tierChipClass}>{dashboard.partnerTier} Partner</span>
          </div>
        </div>
      </section>

      <div class="page-shell">
        <section class="metrics-grid">
          <c-ps-dashboard-metric-card
            label="Open Deals"
            value={dashboard.openDealCount}
            icon-name="utility:opportunity"
            icon-alternative-text="Open Deals"
          >
          </c-ps-dashboard-metric-card>

          <c-ps-dashboard-metric-card
            label="Assigned Leads"
            value={dashboard.assignedLeadCount}
            icon-name="utility:lead"
            icon-alternative-text="Assigned Leads"
          >
          </c-ps-dashboard-metric-card>

          <c-ps-dashboard-metric-card
            label="Open MDF"
            value={dashboard.openMdfCount}
            icon-name="utility:money"
            icon-alternative-text="Open MDF"
          >
          </c-ps-dashboard-metric-card>
        </section>

        <section class="workspace-grid">
          <div class="ps-card quick-actions">
            <h2>Quick Actions</h2>
            <div class="action-grid">
              <lightning-button
                type="button"
                class="action-button"
                label="Register Deal"
                icon-name="utility:add"
                title="Register Deal"
                onclick={handleNewDeal}
              >
              </lightning-button>

              <lightning-button
                type="button"
                class="action-button"
                label="View Leads"
                icon-name="utility:lead"
                title="View Leads"
                onclick={handleLeads}
              >
              </lightning-button>

              <lightning-button
                type="button"
                class="action-button"
                label="Request MDF"
                icon-name="utility:money"
                title="Request MDF"
                onclick={handleMdf}
              >
              </lightning-button>

              <lightning-button
                type="button"
                class="action-button"
                label="Content Hub"
                icon-name="utility:file"
                title="Content Hub"
                onclick={handleContent}
              >
              </lightning-button>
            </div>
          </div>

          <div class="ps-card alerts">
            <h2>Recommended Actions</h2>

            <template if:true={hasAlerts}>
              <ul class="alert-list">
                <template for:each={alerts} for:item="alert">
                  <li key={alert} class="alert-row">
                    <lightning-icon
                      icon-name="utility:info"
                      alternative-text="Recommended action"
                      size="x-small"
                    ></lightning-icon>
                    <span>{alert}</span>
                  </li>
                </template>
              </ul>
            </template>

            <template if:false={hasAlerts}>
              <c-ps-empty-state
                title="All clear"
                message="No urgent partner actions right now."
              >
              </c-ps-empty-state>
            </template>
          </div>
        </section>
      </div>
    </template>
  </div>
</template>

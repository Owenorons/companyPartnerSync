<template>
  <div class="ps-page">
    <section class="page-header">
      <div>
        <p class="eyebrow">Pipeline</p>
        <h1>Deal Registrations</h1>
        <p>
          Track registered, approved, conflicted, and protected partner deals.
        </p>
      </div>

      <lightning-button
        variant="brand"
        label="Register Deal"
        onclick={handleRegisterDeal}
      >
      </lightning-button>
    </section>

    <template if:true={loading}>
      <c-ps-loading-state message="Loading deals..."></c-ps-loading-state>
    </template>

    <template if:true={error}>
      <c-ps-error-panel message={error}></c-ps-error-panel>
    </template>

    <template if:true={hasDeals}>
      <div class="deal-grid">
        <template for:each={deals} for:item="deal">
          <article key={deal.dealId} class="deal-card">
            <div class="deal-top">
              <span class="deal-number">{deal.dealNumber}</span>
              <h2>{deal.customerName}</h2>
              <c-ps-status-badge
                label={deal.status}
                variant={deal.badgeVariant}
              ></c-ps-status-badge>
              <strong class="deal-value">{deal.formattedValue}</strong>
            </div>

            <div class="deal-footer">
              <span class="deal-sub">
                {deal.stage} &middot; Protection ends {deal.protectionEndLabel}
                &middot; {deal.conflictStatus}
              </span>
              <button data-id={deal.dealId} onclick={handleOpenDeal}>
                View
              </button>
            </div>
          </article>
        </template>
      </div>
    </template>

    <template if:false={hasDeals}>
      <template if:false={loading}>
        <c-ps-empty-state
          title="No deals yet"
          message="Register your first deal to request partner protection."
        >
        </c-ps-empty-state>
      </template>
    </template>
  </div>
</template>

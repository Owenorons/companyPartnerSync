<template>
  <div class="slds-var-p-around_large budget-card">
    <div class="eyebrow">MDF Budget</div>
    <h2>{annualLabel}</h2>
    <div class="subtitle">Annual Allocation</div>

    <div class="slds-var-m-top_x-large ledger-progress">
      <span class="fill" style={progressFillStyle}></span>
      <span class="tick" style="left: 25%"></span>
      <span class="tick" style="left: 50%"></span>
      <span class="tick" style="left: 75%"></span>
    </div>

    <div class="slds-grid_align-spread slds-grid budget-stats">
      <div>
        <span class="slds-show">Used</span>
        <strong>{usedLabel}</strong>
      </div>
      <div>
        <span class="slds-show">Remaining</span>
        <strong>{remainingLabel}</strong>
      </div>
    </div>
  </div>
</template>

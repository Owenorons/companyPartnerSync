<template>
  <section class="slds-var-p-around_large" aria-labelledby="ai-review-title">
    <h1 id="ai-review-title" class="slds-text-heading_large">
      AI Insight Review
    </h1>
    <p class="slds-var-m-bottom_medium">
      Model output remains private until an authorized reviewer accepts it.
    </p>

    <section
      class="slds-box slds-theme_default slds-var-m-bottom_large requests-section"
      aria-labelledby="ai-requests-title"
    >
      <h2 id="ai-requests-title" class="slds-text-heading_medium">
        Partner Requests
      </h2>

      <template lwc:if={requestsError}>
        <c-ps-error-panel message={requestsError}></c-ps-error-panel>
      </template>

      <template lwc:if={hasRequests}>
        <template for:each={requests} for:item="request">
          <div
            key={request.requestId}
            class="slds-grid slds-wrap slds-grid_align-spread slds-var-p-vertical_x-small request-row"
          >
            <div>
              <strong>{request.partnerName}</strong>
              <span class="slds-var-m-left_x-small"
                >{request.insightTypeLabel}</span
              >
              <p class="slds-text-body_small request-notes">{request.notes}</p>
            </div>
            <div class="slds-button-group" role="group">
              <lightning-button
                data-id={request.requestId}
                label="Dismiss"
                disabled={requestActionId}
                onclick={handleDismissRequest}
              ></lightning-button>
              <lightning-button
                data-id={request.requestId}
                label="Action"
                variant="brand"
                disabled={requestActionId}
                onclick={handleActionRequest}
              ></lightning-button>
            </div>
          </div>
        </template>
      </template>

      <template lwc:else>
        <p class="slds-text-body_small">No partner requests waiting.</p>
      </template>
    </section>

    <section
      class="slds-box slds-theme_default slds-var-m-bottom_large generate-section"
      aria-labelledby="ai-generate-title"
    >
      <h2 id="ai-generate-title" class="slds-text-heading_medium">
        Generate New Insight
      </h2>

      <div class="slds-grid slds-wrap slds-gutters slds-var-m-top_small">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-record-picker
            label="Partner"
            object-api-name="Account"
            value={selectedPartnerAccountId}
            filter={partnerAccountFilter}
            onrecordselect={handlePartnerChange}
          ></lightning-record-picker>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-combobox
            label="Insight Type"
            placeholder="Select an insight type"
            options={insightTypeOptions}
            value={selectedInsightType}
            onchange={handleInsightTypeChange}
          ></lightning-combobox>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-input
            label="Context Notes (optional)"
            value={generateContext}
            onchange={handleContextChange}
          ></lightning-input>
        </div>
      </div>

      <div class="slds-var-m-top_medium">
        <lightning-button
          variant="brand"
          label="Generate"
          disabled={isGenerateDisabled}
          onclick={handleGenerate}
        ></lightning-button>

        <template lwc:if={generating}>
          <lightning-spinner
            alternative-text="Generating"
            size="small"
            class="generate-spinner"
          ></lightning-spinner>
        </template>
      </div>

      <template lwc:if={generateStatusMessage}>
        <p class="slds-var-m-top_small generate-status">
          {generateStatusMessage}
        </p>
      </template>

      <template lwc:if={generateError}>
        <c-ps-error-panel message={generateError}></c-ps-error-panel>
      </template>
    </section>

    <template lwc:if={loading}>
      <c-ps-loading-state
        message="Loading AI insights for review"
      ></c-ps-loading-state>
    </template>
    <template lwc:elseif={error}>
      <c-ps-error-panel message={error}></c-ps-error-panel>
    </template>
    <template lwc:elseif={hasInsights}>
      <div class="review-list">
        <template for:each={insights} for:item="insight">
          <article
            key={insight.insightId}
            class="slds-box slds-var-m-bottom_medium"
          >
            <div class="slds-grid slds-wrap slds-grid_align-spread">
              <h2 class="slds-text-heading_medium">{insight.insightType}</h2>
              <c-ps-status-badge
                label={insight.status}
                variant="warning"
              ></c-ps-status-badge>
            </div>
            <p class="slds-var-m-vertical_medium">{insight.summary}</p>
            <lightning-textarea
              data-id={insight.insightId}
              label="Reviewed recommendation"
              value={insight.recommendation}
              onchange={handleRecommendation}
            ></lightning-textarea>
            <div class="slds-var-m-top_medium slds-button-group" role="group">
              <lightning-button
                data-id={insight.insightId}
                data-decision="Dismissed"
                label="Dismiss"
                onclick={handleDecision}
              ></lightning-button>
              <lightning-button
                data-id={insight.insightId}
                data-decision="Accepted"
                label="Accept and publish"
                variant="brand"
                onclick={handleDecision}
              ></lightning-button>
            </div>
          </article>
        </template>
      </div>
    </template>
    <template lwc:else>
      <c-ps-empty-state
        title="No AI insights awaiting review"
        message="New model output will appear here as Draft."
      ></c-ps-empty-state>
    </template>
  </section>
</template>

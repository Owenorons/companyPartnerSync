<template>
  <div class="workspace-shell">
    <aside class="slds-grid_vertical slds-grid sidebar">
      <div class="slds-var-p-around_large sidebar-header">
        <p class="slds-text-body_small eyebrow">Onboarding</p>
        <h1>Risk Approval</h1>
      </div>

      <div class="slds-var-p-around_medium filter-panel">
        <lightning-input type="search" label="Search" onchange={handleSearch}>
        </lightning-input>

        <lightning-combobox
          label="Status"
          value={selectedStatus}
          options={statusOptions}
          onchange={handleStatus}
        >
        </lightning-combobox>
      </div>

      <div class="slds-var-p-around_medium queue-list">
        <template if:true={error}>
          <c-ps-error-panel message={error}></c-ps-error-panel>
        </template>

        <template if:true={showEmptyQueue}>
          <c-ps-empty-state
            title="No approval steps found"
            message="Adjust the queue filters or check back later."
          >
          </c-ps-empty-state>
        </template>

        <template if:true={hasFilteredSteps}>
          <template for:each={filteredSteps} for:item="step">
            <button
              key={step.stepId}
              class={step.rowClass}
              data-id={step.stepId}
              onclick={handleSelectStep}
            >
              <div
                class="slds-media_center slds-grid_align-spread slds-grid queue-top"
              >
                <span class="deal-number">{step.dimension}</span>
                <span class={step.statusClass}>{step.status}</span>
              </div>

              <h3>{step.partnerName}</h3>

              <div class="slds-grid_align-spread slds-grid queue-meta">
                <span>{step.assignedToName}</span>
              </div>
            </button>
          </template>
        </template>
      </div>
    </aside>

    <main class="slds-var-p-around_large review-panel">
      <template if:true={selectedStep}>
        <section
          class="slds-media_center slds-grid_align-spread slds-grid hero-card"
        >
          <div>
            <p class="slds-text-body_small eyebrow">
              {selectedStep.dimension} Review
            </p>
            <h2>{selectedStep.partnerName}</h2>

            <div class="slds-var-m-top_medium slds-grid hero-meta">
              <span class={selectedStep.statusClass}
                >{selectedStep.status}</span
              >
              <span>Assigned: {selectedStep.assignedToName}</span>
            </div>
          </div>
        </section>

        <section class="slds-var-m-top_large detail-grid">
          <article class="panel-card">
            <h3 class="slds-var-m-bottom_medium">Last Decision</h3>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Decided By</span>
              <strong>{selectedStep.decisionByName}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Decided On</span>
              <strong>{selectedStep.decisionOnLabel}</strong>
            </div>

            <div
              class="slds-var-m-top_medium notes-body slds-var-p-around_medium"
            >
              {selectedStep.decisionReason}
            </div>
          </article>

          <article class="panel-card">
            <h3 class="slds-var-m-bottom_medium">Record a Decision</h3>

            <template if:true={selectedStep.canDecide}>
              <lightning-combobox
                label="Decision"
                value={decision}
                options={decisionOptions}
                onchange={handleDecisionChange}
              >
              </lightning-combobox>

              <lightning-textarea
                class="slds-var-m-top_small"
                label="Reason"
                value={reason}
                onchange={handleReasonChange}
              >
              </lightning-textarea>

              <template if:true={submitError}>
                <c-ps-error-panel message={submitError}></c-ps-error-panel>
              </template>

              <lightning-button
                class="slds-var-m-top_medium"
                variant="brand"
                label="Submit Decision"
                disabled={isSubmitDisabled}
                onclick={handleSubmit}
              >
              </lightning-button>
            </template>

            <template if:false={selectedStep.canDecide}>
              <div class="decision-state">
                This step is assigned to another reviewer.
              </div>
            </template>
          </article>
        </section>

        <section class="slds-var-m-top_large">
          <c-ps-partner-exception-panel
            target-onboarding-id={selectedStep.onboardingId}
          ></c-ps-partner-exception-panel>
        </section>
      </template>

      <template if:false={selectedStep}>
        <div class="slds-text-align_center empty-state">
          <lightning-icon icon-name="utility:approval" size="large">
          </lightning-icon>

          <h2>Select an approval step</h2>

          <p>Choose a step from the queue to review its decision.</p>
        </div>
      </template>
    </main>
  </div>
</template>

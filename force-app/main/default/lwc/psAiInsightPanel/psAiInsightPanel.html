<template>
  <div class="ai-panel">
    <div class="ai-header">
      <div>
        <p class="eyebrow">AI Insights</p>
        <h2>Partner Intelligence</h2>
      </div>

      <div class="ai-badge">AI Enabled</div>
    </div>

    <div class="request-panel">
      <h3>Request an AI Insight</h3>

      <lightning-combobox
        label="Insight Type"
        placeholder="Select an insight type"
        options={insightTypeOptions}
        value={requestInsightType}
        onchange={handleRequestTypeChange}
      ></lightning-combobox>

      <lightning-textarea
        label="Notes (optional)"
        value={requestNotes}
        onchange={handleRequestNotesChange}
      ></lightning-textarea>

      <lightning-button
        class="request-submit"
        variant="brand"
        label="Submit Request"
        disabled={isRequestDisabled}
        onclick={handleSubmitRequest}
      ></lightning-button>

      <template lwc:if={requestConfirmation}>
        <p class="request-confirmation">{requestConfirmation}</p>
      </template>

      <template lwc:if={requestError}>
        <c-ps-error-panel message={requestError}></c-ps-error-panel>
      </template>

      <template lwc:if={hasMyRequests}>
        <ul class="my-requests">
          <template for:each={myRequestRows} for:item="request">
            <li key={request.requestId}>
              <span class={request.statusClass}>{request.status}</span>
              <span class="my-request-type">{request.insightTypeLabel}</span>
            </li>
          </template>
        </ul>
      </template>
    </div>

    <template lwc:if={isLoading}>
      <c-ps-loading-state message="Loading AI insights"></c-ps-loading-state>
    </template>

    <template lwc:elseif={error}>
      <c-ps-error-panel message={error}></c-ps-error-panel>
    </template>

    <template lwc:elseif={hasInsights}>
      <template for:each={insights} for:item="insight">
        <article key={insight.insightId} class="insight-card">
          <div class="insight-top">
            <div>
              <h3>{insight.insightType}</h3>
              <p>{insight.generatedLabel}</p>
            </div>

            <div class="score-circle">{insight.score}</div>
          </div>

          <div class="summary">{insight.summary}</div>

          <div class="recommendation">
            <strong>Recommendation</strong>
            <p>{insight.recommendation}</p>
          </div>

          <div class="reason">
            <strong>Why?</strong>
            <p>{insight.reason}</p>
          </div>

          <div class="confidence">
            <span>Confidence</span>

            <div class="confidence-bar">
              <span
                class="confidence-fill"
                style={insight.confidenceStyle}
              ></span>
              <span class="tick" style="left: 25%"></span>
              <span class="tick" style="left: 50%"></span>
              <span class="tick" style="left: 75%"></span>
            </div>

            <strong>{insight.confidenceLabel}</strong>
          </div>
        </article>
      </template>
    </template>

    <template lwc:else>
      <c-ps-empty-state
        title="No AI insights yet"
        message="Insights will appear after PartnerSync has enough partner activity to generate governed recommendations."
      ></c-ps-empty-state>
    </template>
  </div>
</template>

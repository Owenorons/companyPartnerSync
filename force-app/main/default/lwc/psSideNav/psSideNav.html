<template>
  <div class="nav-shell">
    <div class="slds-grid slds-media_center brand">
      <div class="logo">PS</div>

      <div>
        <h1 class="slds-text-color_inverse">PartnerSync</h1>
        <p class="slds-text-color_weak">Accelerator</p>
      </div>
    </div>

    <nav
      class="slds-var-m-top_x-large nav-list"
      aria-label="PartnerSync sections"
    >
      <template for:each={navItems} for:item="item">
        <a
          key={item.name}
          href={item.href}
          class={item.className}
          aria-current={item.ariaCurrent}
          aria-label={item.label}
          title={item.label}
          data-name={item.name}
          onclick={handleNavClick}
        >
          <div class="slds-media__figure">
            <lightning-icon
              icon-name={item.iconName}
              alternative-text=""
              size="small"
            >
            </lightning-icon>
          </div>
          <div class="slds-media__body">
            <span>{item.label}</span>
            <span class="slds-assistive-text">{item.mobileLabel}</span>
          </div>
        </a>
      </template>
    </nav>
  </div>
</template>

<template>
  <form class="request-form" onsubmit={handleSubmit}>
    <div>
      <p class="eyebrow">New Request</p>
      <h2>Request MDF</h2>
    </div>

    <lightning-input
      name="campaignName"
      label="Campaign Name"
      value={campaignName}
      onchange={handleChange}
      required
    >
    </lightning-input>

    <lightning-input
      name="requestedAmount"
      label="Requested Amount"
      type="number"
      min="1"
      value={requestedAmount}
      onchange={handleChange}
      required
    >
    </lightning-input>

    <lightning-textarea
      name="businessJustification"
      label="Business Justification"
      value={businessJustification}
      onchange={handleChange}
      required
    >
    </lightning-textarea>

    <lightning-button type="submit" label="Submit Request" variant="brand">
    </lightning-button>
  </form>
</template>

<template>
  <div class="workspace-shell">
    <aside class="slds-grid_vertical slds-grid sidebar">
      <div class="slds-var-p-around_large sidebar-header">
        <p class="slds-text-body_small eyebrow">Operations</p>
        <h1>Deal Review</h1>
      </div>

      <div class="slds-var-p-around_medium filter-panel">
        <lightning-input type="search" label="Search" onchange={handleSearch}>
        </lightning-input>

        <lightning-combobox
          label="Status"
          value={selectedStatus}
          options={statusOptions}
          onchange={handleStatus}
        >
        </lightning-combobox>

        <lightning-combobox
          label="Conflict"
          value={selectedConflict}
          options={conflictOptions}
          onchange={handleConflict}
        >
        </lightning-combobox>
      </div>

      <div class="slds-var-p-around_medium queue-list">
        <template if:true={error}>
          <c-ps-error-panel message={error}></c-ps-error-panel>
        </template>

        <template if:true={showEmptyQueue}>
          <c-ps-empty-state
            title="No deals found"
            message="Adjust the queue filters or check back later."
          >
          </c-ps-empty-state>
        </template>

        <template if:true={hasFilteredDeals}>
          <template for:each={filteredDeals} for:item="deal">
            <button
              key={deal.dealId}
              class={deal.rowClass}
              data-id={deal.dealId}
              onclick={handleSelectDeal}
            >
              <div
                class="slds-media_center slds-grid_align-spread slds-grid queue-top"
              >
                <span class="deal-number">{deal.dealNumber}</span>
                <span class={deal.statusClass}>{deal.status}</span>
              </div>

              <h3>{deal.customerName}</h3>

              <div class="slds-grid_align-spread slds-grid queue-meta">
                <span>{deal.partnerName}</span>
                <strong>{deal.formattedValue}</strong>
              </div>
            </button>
          </template>
        </template>
      </div>
    </aside>

    <main class="slds-var-p-around_large review-panel">
      <template if:true={selectedDeal}>
        <template if:true={detailError}>
          <c-ps-error-panel message={detailError}></c-ps-error-panel>
        </template>

        <template if:true={loadingDetail}>
          <c-ps-loading-state
            message="Loading deal detail"
          ></c-ps-loading-state>
        </template>

        <section
          class="slds-media_center slds-grid_align-spread slds-grid hero-card"
        >
          <div>
            <p class="slds-text-body_small eyebrow">Deal Registration</p>
            <h2>{selectedDeal.customerName}</h2>

            <div class="slds-var-m-top_medium slds-grid hero-meta">
              <span>{selectedDeal.partnerName}</span>
              <span>{selectedDeal.stage}</span>
              <span>{selectedDeal.formattedValue}</span>
            </div>
          </div>

          <template if:true={selectedDeal.isReviewable}>
            <div class="slds-grid hero-actions">
              <template if:true={selectedDeal.canApprove}>
                <button class="approve" onclick={handleApprove}>Approve</button>
              </template>

              <template if:true={selectedDeal.canReject}>
                <button class="reject" onclick={handleReject}>Reject</button>
              </template>
            </div>

            <template if:true={showNoDecisionPermission}>
              <div class="decision-state">
                You do not have permission to decide this deal.
              </div>
            </template>
          </template>

          <template if:false={selectedDeal.isReviewable}>
            <template if:true={selectedDeal.isStamped}>
              <div class="stamp-wrap">
                <span class={selectedDeal.stampClass}
                  >{selectedDeal.status}</span
                >
              </div>
            </template>

            <template if:false={selectedDeal.isStamped}>
              <div class="decision-state">{selectedDeal.status}</div>
            </template>
          </template>
        </section>

        <section class="slds-var-m-top_large detail-grid">
          <article class="panel-card">
            <h3 class="slds-var-m-bottom_medium">Conflict Analysis</h3>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Conflict Status</span>
              <strong class={selectedDeal.conflictClass}>
                {selectedDeal.conflictStatus}
              </strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Protection Window</span>
              <strong>{selectedDeal.protectionEndLabel}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Submitted</span>
              <strong>{selectedDeal.createdDateLabel}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Related Registrations</span>
              <strong>{selectedDeal.conflictCount}</strong>
            </div>

            <template if:true={selectedDeal.hasConflicts}>
              <div class="slds-var-m-top_medium conflict-list">
                <template for:each={selectedDeal.conflicts} for:item="conflict">
                  <div key={conflict.dealId} class="conflict-row">
                    <div>
                      <strong>{conflict.dealNumber}</strong>
                      <span>{conflict.partnerName}</span>
                    </div>
                    <div>
                      <span>{conflict.status}</span>
                      <strong>{conflict.formattedValue}</strong>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </article>

          <article class="panel-card">
            <h3 class="slds-var-m-bottom_medium">AI Deal Risk</h3>

            <div class={selectedDeal.riskScoreClass}>
              {selectedDeal.riskScore}
            </div>

            <p class="risk-label">{selectedDeal.riskLevel} Risk</p>

            <div class={selectedDeal.riskSummaryClass}>
              {selectedDeal.riskSummary}
            </div>

            <div class="slds-var-m-top_medium recommendation">
              <strong>Recommendation</strong>
              <p>{selectedDeal.riskRecommendation}</p>
            </div>
          </article>

          <template if:true={selectedDeal.showRejectionReason}>
            <article class="panel-card full-width decision-detail">
              <h3 class="slds-var-m-bottom_medium">Rejection Reason</h3>
              <div class="slds-var-p-around_medium notes-body">
                {selectedDeal.rejectionReason}
              </div>
            </article>
          </template>

          <template if:true={selectedDeal.showApprovalNotes}>
            <article class="panel-card full-width decision-detail">
              <h3 class="slds-var-m-bottom_medium">Approval Notes</h3>
              <div class="slds-var-p-around_medium notes-body">
                {selectedDeal.approvalNotes}
              </div>
            </article>
          </template>

          <template if:true={selectedDeal.showConflictResolutionNotes}>
            <article class="panel-card full-width decision-detail">
              <h3 class="slds-var-m-bottom_medium">Conflict Resolution</h3>
              <div class="slds-var-p-around_medium notes-body">
                {selectedDeal.conflictResolutionNotes}
              </div>
            </article>
          </template>

          <article class="panel-card full-width">
            <h3 class="slds-var-m-bottom_medium">Deal Notes</h3>

            <div class="slds-var-p-around_medium notes-body">
              {selectedDeal.notes}
            </div>
          </article>
        </section>
      </template>

      <template if:false={selectedDeal}>
        <div class="slds-text-align_center empty-state">
          <lightning-icon icon-name="utility:queue" size="large">
          </lightning-icon>

          <h2>Select a deal</h2>

          <p>Choose a deal from the review queue to begin assessment.</p>
        </div>
      </template>
    </main>
  </div>

  <template if:true={showRejectDialog}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="reject-dialog-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="reject-dialog-heading" class="slds-modal__title">
            Reject Deal
          </h2>
        </header>

        <div class="slds-modal__content slds-var-p-around_medium">
          <lightning-textarea
            label="Rejection reason"
            value={rejectionReason}
            required
            onchange={handleRejectionReasonChange}
          >
          </lightning-textarea>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCancelReject}
          >
          </lightning-button>

          <lightning-button
            class="slds-var-m-left_small"
            variant="destructive"
            label="Reject"
            disabled={isRejectDisabled}
            onclick={handleConfirmReject}
          >
          </lightning-button>
        </footer>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

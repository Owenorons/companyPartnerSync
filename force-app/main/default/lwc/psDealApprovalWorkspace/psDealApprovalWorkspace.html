<template>
  <div class="workspace-shell">
    <aside class="slds-grid_vertical slds-grid sidebar">
      <div class="slds-var-p-around_large sidebar-header">
        <p class="slds-text-body_small eyebrow">Operations</p>
        <h1>My Approval Steps</h1>
      </div>

      <div class="slds-var-p-around_medium queue-list">
        <template if:true={error}>
          <c-ps-error-panel message={error}></c-ps-error-panel>
        </template>

        <template if:true={showEmptyQueue}>
          <c-ps-empty-state
            title="No pending steps"
            message="You have no approval steps waiting on a decision."
          >
          </c-ps-empty-state>
        </template>

        <template if:true={hasSteps}>
          <template for:each={steps} for:item="step">
            <button
              key={step.approvalId}
              class={step.rowClass}
              data-id={step.approvalId}
              onclick={handleSelectStep}
            >
              <div
                class="slds-media_center slds-grid_align-spread slds-grid queue-top"
              >
                <span class="deal-number">{step.dealNumber}</span>
                <span class="ps-badge ps-badge-warning">{step.status}</span>
              </div>

              <h3>{step.customerName}</h3>

              <div class="slds-grid_align-spread slds-grid queue-meta">
                <span>{step.stepKey}</span>
                <strong>{step.formattedValue}</strong>
              </div>
            </button>
          </template>
        </template>
      </div>
    </aside>

    <main class="slds-var-p-around_large review-panel">
      <template if:true={selectedStep}>
        <template if:true={detailError}>
          <c-ps-error-panel message={detailError}></c-ps-error-panel>
        </template>

        <template if:true={loadingDetail}>
          <c-ps-loading-state
            message="Loading approval step detail"
          ></c-ps-loading-state>
        </template>

        <section
          class="slds-media_center slds-grid_align-spread slds-grid hero-card"
        >
          <div>
            <p class="slds-text-body_small eyebrow">{selectedStep.stepKey}</p>
            <h2>{selectedStep.customerName}</h2>

            <div class="slds-var-m-top_medium slds-grid hero-meta">
              <span>{selectedStep.dealNumber}</span>
              <span>{selectedStep.partnerName}</span>
              <span>{selectedStep.formattedValue}</span>
            </div>
          </div>

          <template if:true={selectedStep.canDecide}>
            <div class="slds-grid hero-actions">
              <button class="approve" onclick={handleApprove}>Approve</button>
              <button
                class="conditions"
                onclick={handleOpenApproveWithConditions}
              >
                Approve with Conditions
              </button>
              <button class="reject" onclick={handleOpenReject}>Reject</button>
              <button class="return" onclick={handleOpenReturn}>Return</button>
            </div>
          </template>

          <template if:true={selectedStep.showNoDecisionPermission}>
            <div class="decision-state">
              You do not have permission to decide this step.
            </div>
          </template>
        </section>

        <section class="slds-var-m-top_large detail-grid">
          <article class="panel-card">
            <h3 class="slds-var-m-bottom_medium">Step Status</h3>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Status</span>
              <strong>{selectedStep.status}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Sequence</span>
              <strong>{selectedStep.sequence}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Authority Limit</span>
              <strong>{selectedStep.authorityLimitLabel}</strong>
            </div>

            <div class="slds-grid slds-grid_align-spread status-row">
              <span>Submitted</span>
              <strong>{selectedStep.submittedLabel}</strong>
            </div>
          </article>

          <template if:true={selectedStep.hasDecision}>
            <article class="panel-card full-width decision-detail">
              <h3 class="slds-var-m-bottom_medium">Recorded Decision</h3>

              <div class="slds-grid slds-grid_align-spread status-row">
                <span>Decision</span>
                <strong>{selectedStep.decision}</strong>
              </div>

              <div class="slds-grid slds-grid_align-spread status-row">
                <span>Decided On</span>
                <strong>{selectedStep.decisionOnLabel}</strong>
              </div>

              <div class="slds-var-p-around_medium notes-body">
                {selectedStep.decisionReason}
              </div>
            </article>
          </template>
        </section>
      </template>

      <template if:false={selectedStep}>
        <div class="slds-text-align_center empty-state">
          <lightning-icon icon-name="utility:approval" size="large">
          </lightning-icon>

          <h2>Select a step</h2>

          <p>Choose an approval step from the queue to begin.</p>
        </div>
      </template>
    </main>
  </div>

  <template if:true={showDecisionDialog}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="decision-dialog-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="decision-dialog-heading" class="slds-modal__title">
            {dialogTitle}
          </h2>
        </header>

        <div class="slds-modal__content slds-var-p-around_medium">
          <template if:true={isDialogReason}>
            <lightning-textarea
              label="Reason"
              value={decisionReason}
              required
              onchange={handleReasonChange}
            >
            </lightning-textarea>
          </template>

          <template if:true={isDialogCondition}>
            <lightning-input
              type="text"
              label="Condition Type"
              value={conditionType}
              required
              onchange={handleConditionTypeChange}
            >
            </lightning-input>

            <lightning-textarea
              class="slds-var-m-top_small"
              label="Condition Description"
              value={conditionDescription}
              required
              onchange={handleConditionDescriptionChange}
            >
            </lightning-textarea>
          </template>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCancelDialog}
          >
          </lightning-button>

          <lightning-button
            class="slds-var-m-left_small"
            variant="brand"
            label="Confirm"
            disabled={isConfirmDisabled}
            onclick={handleConfirmDialog}
          >
          </lightning-button>
        </footer>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

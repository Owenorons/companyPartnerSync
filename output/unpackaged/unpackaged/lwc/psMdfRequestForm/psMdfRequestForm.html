<template>
  <form class="request-form" onsubmit={handleSubmit}>
    <div>
      <p class="eyebrow">New Request</p>
      <h2>Request MDF</h2>
    </div>

    <lightning-combobox
      name="requestType"
      label="Request Type"
      value={requestType}
      options={requestTypeOptions}
      onchange={handleRequestTypeChange}
      required
    >
    </lightning-combobox>

    <lightning-input
      name="campaignName"
      label="Campaign Name"
      value={campaignName}
      onchange={handleChange}
      required
    >
    </lightning-input>

    <lightning-input
      name="requestedAmount"
      label="Requested Amount"
      type="number"
      min="1"
      value={requestedAmount}
      onchange={handleChange}
      required
    >
    </lightning-input>

    <lightning-textarea
      name="campaignDescription"
      label="Campaign Description"
      value={campaignDescription}
      onchange={handleChange}
    >
    </lightning-textarea>

    <lightning-button type="submit" label="Submit Request" variant="brand">
    </lightning-button>
  </form>
</template>
